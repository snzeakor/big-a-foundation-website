document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 style=\"position:relative;z-index:2;display:flex;gap:12px;flex-wrap:wrap;justify-content:center\">\n    <a href=\"#donate\" style=\"background:#161412;color:#fff;padding:19px 32px;border-radius:999px;font-weight:700;font-size:17px;box-shadow:5px 5px 0 #d8352a;transition:transform .15s,box-shadow .15s\" style-hover=\"transform:translate(-3px,-3px);box-shadow:8px 8px 0 #d8352a;color:#fff\">Give today →<\u002Fa>\n    <a href=\"#events\" style=\"background:#fff;padding:17px 30px;border-radius:999px;font-weight:700;font-size:17px;border:2.5px solid #161412;box-shadow:5px 5px 0 #1aa58f;transition:transform .15s,box-shadow .15s\" style-hover=\"transform:translate(-3px,-3px);box-shadow:8px 8px 0 #1aa58f\">What's happening<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"position:relative;height:clamp(160px,16vw,220px);overflow:hidden\">\n  <div style=\"position:absolute;left:-5%;right:-5%;top:30%;background:#1aa58f;color:#fff;padding:16px 0;transform:rotate(-3deg);border-block:3px solid #161412\">{{ mqA }}<\u002Fdiv>\n  <div style=\"position:absolute;left:-5%;right:-5%;top:34%;background:#ef7d16;color:#161412;padding:16px 0;transform:rotate(3deg);border-block:3px solid #161412\">{{ mqB }}<\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"max-width:1320px;margin:0 auto;padding:clamp(60px,8vw,100px) clamp(16px,4vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:24px;justify-items:center\">\n  <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n    <div data-reveal=\"\" style=\"width:min(100%,260px);aspect-ratio:1;border-radius:50%;background:{{ s.bg }};color:{{ s.fg }};border:3px solid #161412;box-shadow:6px 6px 0 #161412;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:24px;rotate:{{ s.rot }};transition:rotate .3s\" style-hover=\"rotate:0deg\">\n      <span data-count=\"{{ s.n }}\" data-suffix=\"{{ s.suf }}\" style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(48px,5vw,68px);line-height:1;letter-spacing:-.04em\">{{ s.label0 }}<\u002Fspan>\n      <span style=\"font-weight:700;font-size:16px;max-width:160px\">{{ s.label }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fsection>\n\n<section style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(16px,4vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(32px,5vw,80px);align-items:center\">\n  <div data-reveal=\"\" style=\"position:relative;aspect-ratio:1;max-width:520px;width:100%;justify-self:center\">\n    <div style=\"position:absolute;inset:4% 14% 14% 4%;background:#fff;border:3px solid #161412;padding:14px 14px 50px;rotate:-5deg;box-shadow:8px 8px 0 #161412\"><div style=\"width:100%;height:100%;background:repeating-linear-gradient(135deg,#d3eee8 0 12px,#c7e8e0 12px 24px);display:flex;align-items:flex-end;padding:10px\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#22665a\">photo: DFW community<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"position:absolute;inset:22% 0 0 26%;background:#fff;border:3px solid #161412;padding:14px 14px 50px;rotate:6deg;box-shadow:8px 8px 0 #161412\"><div style=\"width:100%;height:100%;background:repeating-linear-gradient(135deg,#fde0c2 0 12px,#fbd5ae 12px 24px);display:flex;align-items:flex-end;padding:10px\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#8a4a10\">photo: Nigeria<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"\" data-delay=\"120\" style=\"display:flex;flex-direction:column;gap:22px\">\n    <span style=\"font-family:'JetBrains Mono';font-size:13px;letter-spacing:.08em;color:#d8352a\">OUR MISSION<\u002Fspan>\n    <h2 style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(36px,4.6vw,64px);line-height:1;letter-spacing:-.035em;text-wrap:balance\">Two homes. One big heart in the middle.<\u002Fh2>\n    <p style=\"font-size:19px;line-height:1.6;color:#4a453f\">At home ools\" style=\"padding:0 clamp(16px,4vw,40px)\">\n  <div data-reveal=\"\" style=\"max-width:1320px;margin:0 auto;background:#1aa58f;color:#fff;border:3px solid #161412;border-radius:44px;box-shadow:10px 10px 0 #161412;padding:clamp(32px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,72px);align-items:center;position:relative\">\n    {{ sticker }}\n    <div style=\"display:flex;flex-direction:column;gap:24px\">\n      <span style=\"font-family:'JetBrains Mono';font-size:13px;letter-spacing:.08em;background:#fff;color:#161412;border:2px solid #161412;border-radius:999px;padding:8px 14px;align-self:flex-start;rotate:-2deg\">SCHOOLS ACROSS AFRICA<\u002Fspan>\n      <h2 style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(40px,5.4vw,80px);line-height:.95;letter-spacing:-.04em\">Brick by brick, schools across Africa.<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.6;color:#ecfbf8\">It starts in Owerri, Imo State, where our first school is rising now. More communities across Nigeria and Africa are next.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"height:26px;border-radius:999px;background:#fff;border:3px solid #161412;overflow:hidden\">{{ buildBar }}<\u002Fdiv>\n        <span style=\"font-weight:700\">School 01 · Owerri: foundation &amp; walls<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px\">\n        <div style=\"background:#161412;color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#4fd1b9\">SCHOOL 01<\u002Fspan><span style=\"font-weight:700\">Owerri, Nigeria<\u002Fspan><span style=\"font-size:13px;color:#c9c2b8\">Building now<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;color:#161412;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono';font-size:11px\">NEXT<\u002Fspan><span style=\"font-weight:700\">More of Nigeria<\u002Fspan><span style=\"font-size:13px\">Planning<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;color:#161412;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono';font-size:11px\">VISION<\u002Fspan><span style=\"font-weight:700\">Across Africa<\u002Fspan><span style=\"font-size:13px\">The goal<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#donate\" sc-camel-on-click=\"{{ fundOwerri }}\" style=\"align-self:flex-start;background:#ef7d16;color:#161412;padding:18px 30px;border-radius:999px;font-weight:800;font-size:17px;border:3px solid #161412;box-shadow:5px 5px 0 #161412\" style-hover=\"color:#161412;background:#fff\">Fund a brick →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n      <div style=\"grid-column:span 2;aspect-ratio:16/9;border-radius:22px;border:3px solid #161412;background:repeating-linear-gradient(135deg,#43bba7 0 12px,#38b19c 12px 24px);display:flex;align-items:flex-end;padding:12px\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#0d4a40\">photo: school site<\u002Fspan><\u002Fdiv>\n      <div style=\"aspect-ratio:1;border-radius:22px;border:3px solid #161412;background:repeating-linear-gradient(135deg,#43bba7 0 12px,#38b19c 12px 24px);display:flex;align-items:flex-end;padding:12px;rotate:-3deg\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#0d4a40\">photo: students<\u002Fspan><\u002Fdiv>\n      <div style=\"aspect-ratio:1;border-radius:22px;border:3px solid #161412;background:repeating-linear-gradient(135deg,#43bba7 0 12px,#38b19c 12px 24px);display:flex;align-items:flex-end;padding:12px;rotate:3deg\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#0d4a40\">photo: builders<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"events\" style=\"max-width:1320px;margin:0 auto;padding:clamp(90px,11vw,150px) clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:44px\">\n  <h2 data-reveal=\"\" style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(44px,6.4vw,96px);line-height:.95;letter-spacing:-.045em;text-align:center\">Save the date<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px\">\n    <sc-for list=\"{{ events }}\" as=\"e\" hint-placeholder-count=\"4\">\n      <a data-reveal=\"\" href=\"#volunteer\" style=\"display:grid;grid-template-columns:120px minmax(0,1fr);background:#fff;border:3px solid #161412;border-radius:24px;overflow:hidden;box-shadow:6px 6px 0 #161412;transition:translate .2s,box-shadow .2s\" style-hover=\"translate:-3px -3px;box-shadow:9px 9px 0 #161412;color:#161412\">\n        <div style=\"background:{{ e.color }};border-right:3px dashed #161412;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:2px\"><span style=\"font-family:'Unbounded';font-weight:900;font-size:44px;line-height:1\">{{ e.day }}<\u002Fspan><span style=\"font-family:'JetBrains Mono';font-size:12px\">{{ e.month }}<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:8px;justify-content:center\"><span style=\"font-family:'Unbounded';font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.15\">{{ e.title }}<\u002Fspan><span style=\"color:#4a453f\">{{ e.place }}<\u002Fspan><span style=\"font-weight:800;font-size:14px;color:#d8352a\">{{ e.cta }} →<\u002Fspan><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#161412;color:#fff;padding:clamp(80px,10vw,140px) clamp(16px,4vw,40px);overflow:hidden\">\n  <div style=\"max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:56px\">\n    <h2 data-reveal=\"\" style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(44px,6.4vw,96px);line-height:.95;letter-spacing:-.045em;text-align:center\">The wall of <span style=\"color:#ef7d16\">good<\u002Fspan><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:28px\">\n      <sc-for list=\"{{ gallery }}\" as=\"g\" hint-placeholder-count=\"8\">\n        <div data-reveal=\"\" style=\"background:#fff;padding:12px 12px 44px;rotate:{{ g.rot }};box-shadow:0 20px 40px -14px rgba(0,0,0,.6);transition:rotate .3s,scale .3s;position:relative\" style-hover=\"rotate:0deg;scale:1.06\">\n          <div style=\"aspect-ratio:1;background:{{ g.stripe }};display:flex;align-items:flex-end;padding:10px\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#3d3832\">photo: {{ g.label }}<\u002Fspan><\u002Fdiv>\n          <span style=\"position:absolute;top:-12px;left:50%;translate:-50% 0;width:80px;height:24px;background:{{ g.tape }};opacity:.9;rotate:-3deg\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"donate\" style=\"padding:0 clamp(16px,4vw,40px) clamp(80px,10vw,130px)\">\n  <div data-reveal=\"\" style=\"max-width:1320px;margin:0 auto;background:#d8352a;color:#fff;border:3px solid #161412;border-radius:44px;box-shadow:10px 10px 0 #161412;padding:clamp(28px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,72px);align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\">\n      <h2 style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(48px,6.4vw,100px);line-height:.92;letter-spacing:-.045em\">Give big. Feel bigger.<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.55;max-width:460px\">Pick a cause and an amount. We'll put it to work in DFW or across Africa.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;color:#161412;border:3px solid #161412;border-radius:30px;padding:clamp(20px,3vw,34px);display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;border:2.5px solid #161412;border-radius:999px;overflow:hidden\">\n        <sc-for list=\"{{ freqTabs }}\" as=\"f\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"font-weight:800;font-size:15px;padding:13px;border:none;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }}\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ funds }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;border:2.5px solid #161412;background:{{ f.bg }};color:#161412\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n        <sc-for list=\"{{ amounts }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"font-family:'Unbounded';font-weight:900;font-size:20px;padding:18px 4px;border-radius:18px;cursor:pointer;border:2.5px solid #161412;background:{{ a.bg }};color:#161412;box-shadow:{{ a.shadow }};translate:{{ a.lift }};transition:all .15s\">${{ a.value }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;line-height:1.45;color:#4a453f\">{{ impactLine }}<\u002Fp>\n      <button sc-camel-on-click=\"{{ give }}\" style=\"font-weight:800;font-size:18px;padding:19px;border-radius:999px;border:3px solid #161412;cursor:pointer;background:#161412;color:#fff;box-shadow:5px 5px 0 #ef7d16\" style-hover=\"background:#1aa58f\">{{ giveLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ thanks }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"text-align:center;font-weight:800;color:#137a6a\">♥ Thank you! Checkout connects here.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"volunteer\" style=\"max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,40px) clamp(80px,10vw,130px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(32px,5vw,72px);align-items:center\">\n  <div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <h2 style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(44px,6vw,88px);line-height:.95;letter-spacing:-.045em\">Got two hands? <span style=\"color:#1aa58f\">We need 'em.<\u002Fspan><\u002Fh2>\n    <p style=\"font-size:19px;line-height:1.6;color:#4a453f\">Events, mentoring, drives, school building. Tell us where you want to jump in.<\u002Fp>\n  <\u002Fdiv>\n  <div data-reveal=\"\" data-delay=\"120\" style=\"background:#ef7d16;border:3px solid #161412;border-radius:32px;box-shadow:8px 8px 0 #161412;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:14px;rotate:1deg\">\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <input placeholder=\"Your name\" value=\"{{ volName }}\" sc-camel-on-change=\"{{ setName }}\" style=\"font-size:17px;font-weight:600;padding:16px 20px;border-radius:999px;border:2.5px solid #161412;background:#fff;outline:none\" style-focus=\"box-shadow:4px 4px 0 #161412\">\n        <input placeholder=\"Email\" value=\"{{ volEmail }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"font-size:17px;font-weight:600;padding:16px 20px;border-radius:999px;border:2.5px solid #161412;background:#fff;outline:none\" style-focus=\"box-shadow:4px 4px 0 #161412\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ interests }}\" as=\"i\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ i.onClick }}\" style=\"font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;cursor:pointer;border:2.5px solid #161412;background:{{ i.bg }};color:{{ i.fg }}\">{{ i.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ submitVol }}\" style=\"font-weight:800;font-size:18px;padding:18px;border-radius:999px;border:3px solid #161412;cursor:pointer;background:#161412;color:#fff\" style-hover=\"background:#d8352a\">Count me in →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:20px 4px\"><span style=\"font-family:'Unbounded';font-weight:900;font-size:44px;letter-spacing:-.03em\">You're in! ♥<\u002Fspan><p style=\"font-size:18px;font-weight:600\">We'll be in touch soon.<\u002Fp><\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;border-block:3px solid #161412;padding:clamp(70px,9vw,110px) clamp(16px,4vw,40px)\">\n  <div style=\"max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:32px;align-items:center\">\n    <h2 data-reveal=\"\" style=\"font-family:'Unbounded';font-weight:900;font-size:clamp(34px,5vw,72px);letter-spacing:-.04em\">@bigafoundation<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;width:100%\">\n      <sc-for list=\"{{ insta }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <a data-reveal=\"\" href=\"https://www.instagram.com/bigafoundation/\" target=\"_blank\" style=\"aspect-ratio:1;border-radius:22px;border:2.5px solid #161412;background:{{ g.stripe }};display:flex;align-items:flex-end;padding:10px;transition:rotate .25s\" style-hover=\"rotate:-3deg\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:#3d3832\">ig post<\u002Fspan><\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <a href=\"https://www.instagram.com/bigafoundation/\" target=\"_blank\" style=\"background:#161412;color:#fff;padding:16px 28px;border-radius:999px;font-weight:800;box-shadow:5px 5px 0 #1aa58f\" style-hover=\"color:#fff;background:#d8352a\">Follow along ↗<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"contact\" style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,100px) clamp(16px,4vw,40px) 36px;display:flex;flex-direction:column;gap:48px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:32px;align-items:start\">\n    <img src=\"d660938a-599a-447e-80da-786d5e45408f\" alt=\"Big A Foundation\" style=\"width:150px;mix-blend-mode:multiply\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono';font-size:12px;color:#5b554e\">SAY HI<\u002Fspan><a href=\"mailto:hello@bigafoundation.org\" style=\"font-family:'Unbounded';font-weight:700;font-size:18px\">hello@bigafoundation.org<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono';font-size:12px;color:#5b554e\">PARTNER WITH US<\u002Fspan><a href=\"mailto:partners@bigafoundation.org\" style=\"font-family:'Unbounded';font-weight:700;font-size:18px\">partners@bigafoundation.org<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono';font-size:12px;color:#5b554e\">HOME BASE<\u002Fspan><span style=\"font-family:'Unbounded';font-weight:700;font-size:18px\">Dallas–Fort Worth, TX<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;border-top:2.5px solid #161412;font-size:14px;font-weight:600\"><span>© 2026 Big A Foundation<\u002Fspan><span>501(c)(3) nonprofit · EIN 00-0000000<\u002Fspan><\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultFrequency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Monthly&quot;,&quot;One-time&quot;],&quot;default&quot;:&quot;Monthly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  state = { freq: null, amt: 1, fund: 0, thanks: false, name: '', email: '', ints: [], sent: false, built: false };\n  S = (a, b) => `repeating-linear-gradient(135deg,${a} 0 12px,${b} 12px 24px)`;\n  componentDidMount() {\n    this.io = new IntersectionObserver(es => es.forEach(en => {\n      if (!en.isIntersecting) return;\n      const el = en.target; el.style.opacity = 1; el.style.transform = 'none';\n      if (el.dataset.count) this.count(el);\n      this.io.unobserve(el);\n    }), { threshold: .12 });\n    this.scan = () => document.querySelectorAll('[data-reveal]:not([data-rv]),[data-count]:not([data-rv])').forEach(el => {\n      el.dataset.rv = 1;\n      if (el.hasAttribute('data-reveal')) { const d = el.dataset.delay || Math.random() * 160; el.style.opacity = 0; el.style.transform = 'translateY(50px) scale(.92)'; el.style.transition = `opacity .7s ease ${d}ms, transform .8s cubic-bezier(.3,1.5,.5,1) ${d}ms, rotate .3s, translate .2s, box-shadow .2s, scale .3s`; }\n      this.io.observe(el);\n    });\n    this.scan(); setTimeout(this.scan, 600);\n    this.onScroll = () => { const y = window.scrollY; document.querySelectorAll('[data-par]').forEach(el => el.style.transform = `translateY(${y * +el.dataset.par}px)`); };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    setTimeout(() => this.setState({ built: true }), 500);\n  }\n  componentWillUnmount() { this.io?.disconnect(); window.removeEventListener('scroll', this.onScroll); }\n  count(el) { const end = +el.dataset.count, suf = el.dataset.suffix || ''; let t0; const step = t => { t0 ??= t; const p = Math.min(1, (t - t0) / 1800); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))).toLocaleString() + suf; if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }\n  renderVals() {\n    const e = React.createElement, S = this.S;\n    const motion = this.props.motion !== false;\n    const tilt = (this.props.tilt ?? 1);\n    const freq = this.state.freq ?? this.props.defaultFrequency ?? 'Monthly';\n    const amts = [25, 50, 100, 250], v = amts[this.state.amt];\n    const funds = ['Most needed', 'DFW programs', 'Schools in Africa', 'Scholarships', 'Arts & culture', 'Entrepreneurs'];\n    const impact = { 25: 'buys school supplies for a student', 50: 'stocks a family resource kit', 100: 'funds desks for a new classroom', 250: 'moves a student closer to a full scholarship' };\n    const tog = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x];\n    const r = d => `${d * tilt}deg`;\n    const card = (label, stripe, pos, rot, par, dur, w) => e('div', { key: label, 'data-par': par, style: { position: 'absolute', ...pos, width: w, zIndex: 1 } },\n      e('div', { style: { background: '#fff', border: '3px solid #161412', padding: '10px 10px 34px', rotate: r(rot), boxShadow: '6px 6px 0 #161412', animation: motion ? `bob ${dur}s ease-in-out infinite` : 'none' } },\n        e('div', { style: { aspectRatio: '1', background: stripe, display: 'flex', alignItems: 'flex-end', padding: 8 } }, e('span', { style: { fontFamily: 'JetBrains Mono', fontSize: 10, color: '#3d3832' } }, 'photo: ' + label))));\n    const blob = (txt, bg, fg, pos, sz, anim) => e('div', { key: txt, style: { position: 'absolute', ...pos, width: sz, height: sz, borderRadius: '50%', background: bg, color: fg, border: '3px solid #161412', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Unbounded', fontWeight: 900, fontSize: sz / 4.4, zIndex: 1, animation: motion ? anim : 'none' } }, txt);\n    const mq = (words, dir) => e('div', { style: { display: 'flex', width: 'max-content', whiteSpace: 'nowrap', animation: motion ? `marquee 30s linear infinite ${dir}` : 'none' } }, [...words, ...words, ...words, ...words].map((w, i) => e('span', { key: i, style: { fontFamily: 'Unbounded', fontWeight: 900, fontSize: 30, paddingRight: 28 } }, w + '  ✦')));\n    return {\n      heroCollage: e('div', { 'aria-hidden': true, style: { position: 'absolute', inset: 0, pointerEvents: 'none' } },\n        card('kids at play', S('#d3eee8', '#c7e8e0'), { left: '0%', top: '6%' }, -8, -0.08, 6, 'clamp(110px,14vw,200px)'),\n        card('classroom in Nigeria', S('#fde0c2', '#fbd5ae'), { right: '1%', top: '2%' }, 7, -0.12, 7, 'clamp(120px,15vw,220px)'),\n        card('volunteers', S('#fbdcd8', '#f8cfca'), { left: '4%', bottom: '4%' }, 6, 0.06, 8, 'clamp(100px,12vw,180px)'),\n        card('artist', S('#e6dfd5', '#ddd5c9'), { right: '5%', bottom: '2%' }, -6, 0.1, 6.5, 'clamp(100px,13vw,190px)'),\n        blob('♥', '#d8352a', '#fff', { left: '18%', top: '40%' }, 74, 'wiggle 2.4s ease-in-out infinite'),\n        blob('DFW', '#1aa58f', '#fff', { right: '17%', top: '44%' }, 96, 'spin 20s linear infinite')),\n      mqA: mq(['Community', 'Scholarships', 'Arts & Culture', 'DFW'], 'normal'),\n      mqB: mq(['Nigeria', 'Entrepreneurs', 'Schools', 'Africa'], 'reverse'),\n      sticker: e('div', { 'aria-hidden': true, style: { position: 'absolute', top: -34, right: 40, width: 108, height: 108, borderRadius: '50%', background: '#ef7d16', color: '#161412', border: '3px solid #161412', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', fontFamily: 'Unbounded', fontWeight: 900, fontSize: 13, lineHeight: 1.1, animation: motion ? 'wiggle 3s ease-in-out infinite' : 'none' } }, 'NOW', e('br'), 'BUILDING!'),\n      buildBar: e('div', { style: { height: '100%', width: this.state.built ? '35%' : '0%', background: 'repeating-linear-gradient(45deg,#d8352a 0 12px,#ef7d16 12px 24px)', borderRight: '3px solid #161412', transition: 'width 2.4s cubic-bezier(.2,.7,.2,1)' } }),\n      fundOwerri: () => this.setState({ fund: 2 }),\n      stats: [[2, '', 'continents, one mission', '#1aa58f', '#fff', -6], [1000, '+', 'DFW families reached', '#ef7d16', '#161412', 4], [50, '+', 'scholarships awarded', '#d8352a', '#fff', -3], [1, '', 'first school rising in Owerri', '#fff', '#161412', 6]].map(([n, suf, label, bg, fg, rot]) => ({ n, suf, label, bg, fg, rot: r(rot), label0: n.toLocaleString() + suf })),\n      programs: [\n        ['DFW', 'Community Programs', 'youth program', '#fff', '#161412', S('#d3eee8', '#c7e8e0'), -2, 'Mentoring, workshops and youth programs that build confidence across DFW.'],\n        ['DFW', 'Family Resources', 'resource drive', '#1aa58f', '#fff', S('#d3eee8', '#c7e8e0'), 1.5, 'Food, supplies and essentials, delivered with dignity.'],\n        ['NIGERIA + AFRICA', 'Schools Across Africa', 'classroom', '#fff', '#161412', S('#fde0c2', '#fbd5ae'), -1, 'Building schools across Nigeria and Africa, starting in Owerri.'],\n        ['GLOBAL', 'Scholarships', 'graduate', '#ef7d16', '#161412', S('#fff1e2', '#fde6cc'), 2, 'Higher education doors, opened for students in DFW and Africa.'],\n        ['AFRICA', 'Arts & Culture', 'performance', '#d8352a', '#fff', S('#fbdcd8', '#f8cfca'), -1.5, 'Backing artists and spaces that celebrate African heritage.'],\n        ['AFRICA', 'Entrepreneurs', 'small business', '#fff', '#161412', S('#e6dfd5', '#ddd5c9'), 1, 'Seed funding and support for founders building what comes next.'],\n      ].map(([where, title, photo, bg, fg, stripe, rot, body]) => ({ where, title, photo, bg, fg, stripe, rot: r(rot), body })),\n      events: [\n        { day: '08', month: 'NOV', title: 'Fall Community Day', place: 'Dallas, TX · food, music, resources', cta: 'RSVP', color: '#1aa58f' },\n        { day: '21', month: 'NOV', title: 'Thanksgiving Giveback Drive', place: 'Fort Worth, TX · volunteers needed', cta: 'Volunteer', color: '#ef7d16' },\n        { day: '12', month: 'DEC', title: 'Schools for Africa: Benefit Gala', place: 'Dallas, TX · tickets & tables', cta: 'Get tickets', color: '#ff7b70' },\n        { day: '15', month: 'JAN', title: 'Scholarship Applications Open', place: 'Online · DFW & Nigeria', cta: 'Learn more', color: '#fff8ee' },\n      ],\n      gallery: [['community day', -4, '#1aa58f'], ['students in Nigeria', 3, '#ef7d16'], ['giveback', -2, '#d8352a'], ['gala', 5, '#1aa58f'], ['arts night', 2, '#ef7d16'], ['scholars', -5, '#d8352a'], ['volunteers', 4, '#1aa58f'], ['family day', -3, '#ef7d16']].map(([label, rot, tape], i) => ({ label, rot: r(rot), tape, stripe: [S('#d3eee8', '#c7e8e0'), S('#fde0c2', '#fbd5ae'), S('#fbdcd8', '#f8cfca'), S('#e6dfd5', '#ddd5c9')][i % 4] })),\n      team: [['Founder Name', 'Founder & President', '#d8352a', S('#d3eee8', '#c7e8e0')], ['Team Member', 'Programs Director, DFW', '#1aa58f', S('#fbdcd8', '#f8cfca')], ['Team Member', 'Nigeria Projects Lead', '#ef7d16', S('#fde0c2', '#fbd5ae')], ['Team Member', 'Arts & Culture Lead', '#d8352a', S('#e6dfd5', '#ddd5c9')]].map(([name, role, shadow, stripe]) => ({ name, role, shadow, stripe })),\n      freqTabs: ['One-time', 'Monthly'].map(f => ({ label: f, bg: f === freq ? '#161412' : '#fff', fg: f === freq ? '#fff' : '#161412', onClick: () => this.setState({ freq: f, thanks: false }) })),\n      funds: funds.map((f, i) => ({ label: f, bg: i === this.state.fund ? '#ef7d16' : '#fff', onClick: () => this.setState({ fund: i, thanks: false }) })),\n      amounts: amts.map((a, i) => { const on = i === this.state.amt; return { value: a, bg: on ? '#1aa58f' : '#fff', shadow: on ? '4px 4px 0 #161412' : 'none', lift: on ? '-2px -2px' : '0 0', onClick: () => this.setState({ amt: i, thanks: false }) }; }),\n      impactLine: `$${v}${freq === 'Monthly' ? '/month' : ''} ${impact[v]}. Going to: ${funds[this.state.fund]}.`,\n      giveLabel: `Give $${v}${freq === 'Monthly' ? ' monthly' : ''} →`,\n      give: () => this.setState({ thanks: true }), thanks: this.state.thanks,\n      volName: this.state.name, volEmail: this.state.email,\n      setName: ev => this.setState({ name: ev.target.value }), setEmail: ev => this.setState({ email: ev.target.value }),\n      interests: ['Events', 'Mentoring', 'Drives', 'School building', 'Arts', 'Fundraising'].map(x => { const on = this.state.ints.includes(x); return { label: x, bg: on ? '#161412' : '#fff', fg: on ? '#fff' : '#161412', onClick: () => this.setState(s => ({ ints: tog(s.ints, x) })) }; }),\n      submitVol: () => this.setState({ sent: true }), sent: this.state.sent, notSent: !this.state.sent,\n      insta: [S('#d3eee8', '#c7e8e0'), S('#fde0c2', '#fbd5ae'), S('#fbdcd8', '#f8cfca'), S('#e6dfd5', '#ddd5c9'), S('#d3eee8', '#c7e8e0'), S('#fde0c2', '#fbd5ae')].map(stripe => ({ stripe })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
